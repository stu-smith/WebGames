<body>
  <div class="game-layout">
    <header class="game-header">
      <a href="../../" class="back-link">← WebGames</a>
      <h1>Wordle</h1>
      <button class="new-game-btn" id="btn-new">New Game</button>

      <div class="board" id="board"></div>

  <div class="overlay overlay--hidden" id="end-overlay">

      <h2 id="end-title">Nice!</h2>
      <p id="end-message"></p>
      <div class="end-stats" id="end-stats"></div>

  </div>
